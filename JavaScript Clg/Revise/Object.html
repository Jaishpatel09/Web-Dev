<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Object In JavaScript</h1>
    <script>
        let student = {   // student - object variable
            name: "Jaish Patel", //name - key or property, Jaish Patel - values
            age: 20,
            course: "B-Tech",
            branch: "CSE"
        };
        console.log(student.name);// access object with dot notation
        console.log(student.age);
        console.log(student.course);

        console.log(student["branch"]); //access object with bracket notation

        let mobile = {
            brand: "Vivo",
            price: 15000
        };

        mobile.color = "Black";

        console.log(mobile.color);


    </script>
</body>

</html>
