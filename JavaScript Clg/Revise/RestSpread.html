    <h1>Practice Student Data</h1>
    <script>
        let student = {
            name:"Jaish Patel",
            marks:[70,80,90]
        };  

        function addMarks(...newMarks){
           let allMarks = [...student.marks,...newMarks]
            console.log(allMarks);
        }
        addMarks(95,85);
        
        let updatedStudent={
            ...student,
            marks:[70,80,90,95,85]
        }

        console.log(student.marks);
        console.log(updatedStudent.marks);
