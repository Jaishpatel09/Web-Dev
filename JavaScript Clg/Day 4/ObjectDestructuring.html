<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Object Destructuring</h1>
    <script>
        let student = {
            name: "Jaish",
            age: 20,
            city: "Jabalpur"
        };

        let {name ,age}=student;
        console.log(name);
        console.log(age);

        let {name: userName}= student;

        console.log(userName);
        

        
        
        
    </script>
</body>

</html>
