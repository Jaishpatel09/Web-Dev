<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p class="info">HTML</p>
    <p class="info">CSS</p>
    <p class="info">JavaScript</p>

    <script>
        let items = document.querySelectorAll(".info");

        items.forEach(function(item){
            item.style.color="blue";
        });

    </script>
</body>

</html>
