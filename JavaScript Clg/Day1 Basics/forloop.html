<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>For Loop</h1>

    <script>

        for(let i=1;i<=5;i++){
            console.log("Good Morning");
        }
     //Increment       
        for(let i=1;i<=5;i++){
            console.log(i);
        }
        console.log("Decrement");
        
      //Decrement
         for(let i=5;i>=1;i--){
            console.log(i);
        }   
//Add 2 in all nums
        for(let i=1;i<=5;i+=2){
            console.log(i);
        }
        
         for (let i = 2; i <= 10; i += 2) {
             console.log(i);
        }
//Dec
        for (let i = 10; i >= 1; i -= 3) {
            console.log(i);
        }


    </script>
</body>
</html>
