    <h1>Calculate Total</h1>
    <script>
        function calculateTotal(...prices){
            let totalPrice = 0;
            for(let price of prices){
               totalPrice=totalPrice+price;
            }
            console.log(totalPrice);
            
        }
        calculateTotal(100,200,300,400);
    </script>
