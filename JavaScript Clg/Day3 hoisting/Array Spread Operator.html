<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Array Spread Operator</h1>
    <script>
        let array=[10,20,30,40,50,60];
        let newArray=[...array,70]

        console.log(array);
        console.log(newArray);
        
        let product=["mouse","monitor"];
        let newProduct=["USB",...product,"CPU"]


        console.log(newProduct);
        console.log(product);

        let fruits=["banana","orange"];
        let updateFruits=["mango",...fruits];

        console.log(fruits);
        console.log(updateFruits);
        
        

        let scores = [60,70,80];
        let updatedScores =[50,...scores,90];

        console.log(updatedScores);
        console.log(scores);
        
        
        
        

    </script>
</body>
</html>
