<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Rest Operator</h1>
    <script>
        function numbers(...nums){ //passed arguments ko nums naam ke array mein collect karta hai
            //Rest → multiple values ko collect karke ek array mein rakhta hai.
            console.log(nums);
            
        }
        numbers(10,20,30,40,50);


        function addNumbers(...num){
            let total=0;
            
            for(let nums of num){
                total=total+nums;
            }

            console.log(total);
            
        }
        addNumbers(5,10,15,20,25);


    </script>
</body>
</html>
