<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Map In Array</h1>
    <script>
        let arr=[10,20,30,40];
        let doubled = arr.map(function(ar){
            return ar*2;
        });

        console.log(doubled);
        
    </script>
</body>
