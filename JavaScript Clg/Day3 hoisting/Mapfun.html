    <h1>Map In Array</h1>
    <script>
        let arr=[10,20,30,40];
        let doubled = arr.map(function(ar){
            return ar*2;
        });

        console.log(doubled);

        let num =[2,4,6,8];
        let val=num.map(function(numb,index){
            console.log(numb,index);
            
        });

        let numbers=[11,22,33,44,55,66,77,88,99];
        let resu=numbers.map(function(num,ind,arr){
            console.log(num , ind , arr);
            
        });
        
    </script>
