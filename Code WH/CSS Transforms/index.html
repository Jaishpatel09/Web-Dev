<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transforms</title>
    <style>
        .box{
            height: 50px;
            width: 50px;
            background-color: bisque;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            /* transform: rotate(0.5turn); */
            /* transform: rotateZ(23deg); */
            /* transform: scale3d(); */
            /* transform: skew(9deg); */
            /* transform:translate(10%); */
            transform:rotate(0.3turn) scale(1.1) skew(10deg) translateY(-100%);
        }
        .container{
            width: 100vw;
            height: 80vh;
            border: 2px solid pink;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
           Box
        </div>
    </div>
</body>
</html>
