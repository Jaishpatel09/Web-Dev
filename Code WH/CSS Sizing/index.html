<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sizing</title>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .box{
        box-sizing: border-box;
        border: 5px solid rgb(255, 90, 184);
        border-radius: 620px;
        background-color: aqua;
        /* width: 80vw; */
        height: 80vh;
        width: 80vw;
        margin: auto;
        display: flex;
       align-items: center;
       justify-content: center;
       font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

       box-shadow: 0px 0px 5px rgb(255, 90, 184);
    }
</style>
</head>
<body>
    <div class="box">
        This is a box
    </div>
</body>
</html>
