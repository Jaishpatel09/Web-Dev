<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        :root{
            --prmary-color:rgb(99, 201, 249);
            --text-color:white;
            --secondary-color:rgb(221, 237, 245);
        }
        /* :root{
            --prmary-color:rgb(251, 11, 11);
            --text-color:white;
            --secondary-color:rgb(252, 170, 170);
        } */
        *{
            padding: 0;
            margin: 0;
        }
        body{
            background-color: var(--secondary-color);
        }
        ul li{
            list-style: none;
            display: inline;
            padding: 12px;
            font-weight: bolder;
            color:var(--text-color);
        }
        nav{
            background-color:var(--prmary-color);
            padding: 5px;
            margin: 0;
        }
        ul li a{
            text-decoration: none;
        }
    
    
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</li></a>
                <li><a href="/">Services</li></a>
                <li><a href="/">About Us</li></a>
                <li><a href="/">Contact Us</li></a>
            </ul>
        </nav>
    </header>
</body>
</html>
