<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex-5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: rgb(255, 184, 208);
            height: 30px;
        }

        header {
            position: sticky;
            top: 0%;
        }

        .container {
            background-color: green;
            margin: 12px 8px;
            height: 200px;
            text-align: center;
        }

        .box1 {
            background-color: rgb(255, 141, 179);
            height: 170px;
            width: 160px;
            display: inline-block;
            margin: 4px 12px;
            padding: 10px;

        }

        .box2 {
            background-color: rgb(42, 49, 248);
            height: 170px;
            width: 160px;
            display: inline-block;
            margin: 4px 12px;
            padding: 10px;
        }

        main {
            background-color: rgb(0, 0, 0);
        }

        .text {
            color: white;
            border: 2px solid white;
            padding: 14px;
            margin: 0px 12px;
            border-radius: 12px;
            font-size: 1em;
            text-align: center;

        }

        footer {
            background-color: bisque;
            height: 50px;
        }

        .orangeBox {
            height: 25px;
            width: 25px;
            background-color: orange;
            border-radius: 14px;
            position: fixed;
            bottom: 160px;
            right: 30px;
        }
    </style>
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>
    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="text">
            <p># 👋Hello Dosto Mai Hu Jaish Patel</p>
        </div>
        <div class="orangeBox"></div>
    </main>
    <footer>

    </footer>
</body>

</html>
